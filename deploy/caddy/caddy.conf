# ========================================================
# CADDY FRONTEND SPA CONFIGURATION
# Generic Port Configuration (Proxied by VPS Proxy)
# ========================================================
{
        auto_https off
        servers {
                trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/12 172.64.0.0/13 131.0.72.0/22
        }
}

(security_headers) {
        header X-Content-Type-Options "nosniff"
        header X-Frame-Options "DENY"
        header X-XSS-Protection "1; mode=block"
        header Referrer-Policy "strict-origin-when-cross-origin"
        header -Server
}

(csp_policy) {
        header Content-Security-Policy "default-src 'self' data: blob:; img-src 'self' data: blob: http://localhost:* https://localhost:* capacitor://localhost https://flagcdn.com http://localhost:8000 http://localhost:5174 https://croucloud.xyz https://app.otsentdrone.com https://app.otsentium.com https://app.otsentiummap.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' capacitor://localhost https://localhost http://localhost:* ws://localhost:* http://localhost:8000 http://localhost:5174 https://croucloud.xyz https://cloudflareinsights.com https://app.otsentdrone.com https://app.otsentium.com https://app.otsentiummap.com; font-src 'self' data: blob: https://fonts.gstatic.com; media-src * data: blob: http://localhost:8000 http://localhost:5174 https://croucloud.xyz https://app.otsentdrone.com https://app.otsentium.com https://app.otsentiummap.com; frame-src 'self' *; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
}

:80 {
        # Logging
        log {
                output file /var/log/caddy/frontend.log {
                        roll_size 100mb
                        roll_keep 5
                }
                format json
                level info
        }

        # ========== Access Control (STRICT) ==========
        # Hanya mengizinkan akses dari IP VPS Proxy dan localhost.
        # Jika tidak cocok, request langsung di-abort.
        
        @allowed_ips {
                remote_ip 15.235.197.134 15.235.142.16 176.97.64.112 127.0.0.1 ::1
        }

        # Handle untuk IP yang diizinkan (Normal Process)
        handle @allowed_ips {
                # Security Headers
                import security_headers
                import csp_policy

                # ========== Block Bad User Agents ==========
                @bad_ua {
                        header User-Agent {curl|wget|python-requests|httpclient|scrapy|bot|spider|scan|masscan|dirbuster|nmap}
                }
                handle @bad_ua {
                        respond "Forbidden" 403
                }

                # ========== Root & SPA Configuration ==========
                root * /var/www/frontend-spa/dist

                # ========== Favicon ==========
                handle /favicon.ico {
                        header Cache-Control "public, max-age=31536000, immutable"
                        file_server
                }

                # ========== Index.html - No Cache ==========
                handle /index.html {
                        header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
                        header Expires "-1"
                        header Pragma "no-cache"
                        file_server
                }

                # ========== Static Assets - Aggressive Caching ==========
                @static_files {
                        path_regexp ^.*\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$
                        not path /media/*
                }
                handle @static_files {
                        header Cache-Control "public, max-age=604800, immutable"
                        header X-Content-Type-Options "nosniff"
                        encode gzip zstd
                        file_server
                }

                handle_path /mt/* {
                        reverse_proxy http://127.0.0.1:5000 {
                                transport http {
                                        read_timeout 60s
                                        write_timeout 60s
                                }
                        }
                }

                # ========== /api/* Proxy ==========
                @api path /api/*
                handle @api {
                        reverse_proxy https://croucloud.xyz {
                                header_up Host croucloud.xyz
                                header_up X-Forwarded-Proto https
                                header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        }
                        encode gzip zstd
                }

                # ========== /logout Proxy ==========
                @logout path /logout
                handle @logout {
                        reverse_proxy https://croucloud.xyz {
                                header_up Host croucloud.xyz
                                header_up X-Forwarded-Proto https
                                header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        }
                }

                # ========== /gateway/* → /api/* Rewrite ==========
                @gateway path /gateway/*
                handle @gateway {
                        uri replace /gateway/ /api/
                        reverse_proxy https://croucloud.xyz {
                                header_up Host croucloud.xyz
                                header_up X-Forwarded-Proto https
                                header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        }
                }

                # ========== /media/* OPTIONS (Preflight) ==========
                @media_options {
                        path /media/*
                        method OPTIONS
                }
                handle @media_options {
                        header Access-Control-Allow-Origin {http.request.header.Origin}
                        header Access-Control-Allow-Methods "GET, OPTIONS"
                        header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With"
                        header Access-Control-Max-Age "86400"
                        header Content-Length "0"
                        respond 204
                }

                # ========== /media/* Content (GET) ==========
                @media_content {
                        path /media/*
                }
                handle @media_content {
                        # Add CORS header untuk GET requests
                        header Access-Control-Allow-Origin {http.request.header.Origin}

                        # Reverse proxy ke backend
                        reverse_proxy https://croucloud.xyz {
                                header_up Host croucloud.xyz
                                header_up X-Forwarded-Proto https
                                header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                                header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        }
                }

                # ========== SPA Fallback ==========
                @not_static {
                        not path /static/* /index.html /favicon.ico /mt/* /api/* /logout /gateway/* /media/*
                        not file
                }
                handle @not_static {
                        rewrite * /index.html
                        file_server
                }

                # ========== Serve Static Files (Default Fallback inside allowed) ==========
                encode gzip zstd
                file_server {
                        browse off
                }
        }

        # Handle untuk IP yang TIDAK diizinkan (Block)
        handle {
                abort
        }

        # ========== Error Handling (Outside Handle) ==========
        handle_errors {
                header Content-Type "text/html; charset=utf-8"
                @404 expression `{http.error.status_code} == 404`
                handle @404 {
                        rewrite * /index.html
                        file_server
                }
                handle {
                        header Content-Type "text/plain"
                        respond "Error {http.error.status_code}" {http.error.status_code}
                }
        }
}
