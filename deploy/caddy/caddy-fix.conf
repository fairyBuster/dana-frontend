# ========================================================
# CADDY FRONTEND SPA CONFIGURATION
# ocrn2000.com - React/Vue SPA + Backend Proxy
# ========================================================
{
        auto_https off
        servers {
                trusted_proxies static 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/12 172.64.0.0/13 131.0.72.0/22
        }
}

(security_headers) {
        header X-Content-Type-Options "nosniff"
        header X-Frame-Options "DENY"
        header X-XSS-Protection "1; mode=block"
        header Referrer-Policy "strict-origin-when-cross-origin"
        header -Server
}

(csp_policy) {
        header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://ocrn2000.com https://backendocer.shop; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://backendocer.shop https://cloudflareinsights.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
}

ocrn2000.com, www.ocrn2000.com {
        # TLS dengan Cloudflare certificate
        tls /etc/ssl/cloudflare/cert.pem /etc/ssl/cloudflare/key.pem {
            client_auth {
                mode require_and_verify
                trust_pool file {
                    pem_file /etc/ssl/cloudflare/origin-pull-ca.pem
                }
            }
        }

        # Logging dengan rotation
        log {
                output file /var/log/caddy/ocrn2000.com.log {
                        roll_size 100mb
                        roll_keep 5
                }
                format json
                level info
        }

        # Security Headers
        import security_headers
        import csp_policy

        # ========== Block Bad User Agents ==========
        @bad_ua {
                header User-Agent {curl|wget|python-requests|httpclient|scrapy|bot|spider|scan|masscan|dirbuster|nmap}
        }
        handle @bad_ua {
                respond "Forbidden" 403
        }

        # ========== Root & SPA Configuration ==========
        root * /var/www/frontend-spa/dist

        # ========== Favicon ==========
        handle /favicon.ico {
                header Cache-Control "public, max-age=31536000, immutable"
                file_server
        }

        # ========== Index.html - No Cache ==========
        handle /index.html {
                header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
                header Expires "-1"
                header Pragma "no-cache"
                file_server
        }

        # ========== Static Assets - Aggressive Caching ==========
        @static_files {
                path_regexp ^.*\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$
                not path /media/*
        }
        handle @static_files {
                header Cache-Control "public, max-age=604800, immutable"
                header X-Content-Type-Options "nosniff"
                encode gzip zstd
                file_server
        }

        # ========== /api/* Proxy ==========
        @api path /api/*
        handle @api {
                reverse_proxy https://38.180.191.251 {
                        header_up Host backendocer.shop
                        header_up X-Forwarded-Proto https
                        header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        transport http {
                                tls
                                tls_insecure_skip_verify
                                tls_server_name backendocer.shop
                        }
                }
                encode gzip zstd
        }

        # ========== /logout Proxy ==========
        @logout path /logout
        handle @logout {
                reverse_proxy https://38.180.191.251 {
                        header_up Host backendocer.shop
                        header_up X-Forwarded-Proto https
                        header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        transport http {
                                tls
                                tls_insecure_skip_verify
                                tls_server_name backendocer.shop
                        }
                }
        }

        # ========== /gateway/* → /api/* Rewrite ==========
        @gateway path /gateway/*
        handle @gateway {
                uri replace /gateway/ /api/
                reverse_proxy https://38.180.191.251 {
                        header_up Host backendocer.shop
                        header_up X-Forwarded-Proto https
                        header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        transport http {
                                tls
                                tls_insecure_skip_verify
                                tls_server_name backendocer.shop
                        }
                }
        }

        # ========== /media/* OPTIONS (Preflight) ==========
        @media_options {
                path /media/*
                method OPTIONS
        }
        handle @media_options {
                header Access-Control-Allow-Origin {http.request.header.Origin}
                header Access-Control-Allow-Methods "GET, OPTIONS"
                header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With"
                header Access-Control-Max-Age "86400"
                header Content-Length "0"
                respond 204
        }

        # ========== /media/* Content (GET) ==========
        @media_content {
                path /media/*
        }
        handle @media_content {
                # Add CORS header untuk GET requests
                header Access-Control-Allow-Origin {http.request.header.Origin}

                # Reverse proxy ke backend
                reverse_proxy https://38.180.191.251 {
                        header_up Host backendocer.shop
                        header_up X-Forwarded-Proto https
                        header_up X-Original-Client-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                        header_up X-Forwarded-For {http.request.header.X-Forwarded-For}
                        transport http {
                                tls
                                tls_insecure_skip_verify
                                tls_server_name backendocer.shop
                        }
                }
        }

        # ========== SPA Fallback - Serve index.html untuk routes yang tidak ada ==========
        @not_static {
                not path /static/* /index.html /favicon.ico /api/* /logout /gateway/* /media/*
                not file
        }
        handle @not_static {
                rewrite * /index.html
                file_server
        }

        # ========== Serve Static Files ==========
        encode gzip zstd
        file_server {
                browse off
        }

        # ========== Error Handling ==========
        handle_errors {
                header Content-Type "text/html; charset=utf-8"
                # Serve index.html pada 404 untuk SPA client-side routing
                @404 expression `{http.error.status_code} == 404`
                handle @404 {
                        rewrite * /index.html
                        file_server
                }

                handle {
                        header Content-Type "text/plain"
                        respond "Error {http.error.status_code}" {http.error.status_code}
                }
        }
}