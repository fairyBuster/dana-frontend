include ':app'

def cordovaPluginsProjectDir = new File(rootDir, 'capacitor-cordova-android-plugins')
if (cordovaPluginsProjectDir.exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaPluginsProjectDir
}

apply from: 'capacitor.settings.gradle'
