# Single-site Nginx config for ggeecsxio.com
# SPA + Cloudflare Origin SSL + Real IP + Anti-scan static + Proxy backend
# Place this file in /etc/nginx/sites-available/cmcl.abbt-bt.com.conf and symlink to sites-enabled

# --- http context directives (assumed included under http { ... }) ---
# Bad user-agents map
map $http_user_agent $bad_ua {
  default 0;
  ~*curl|wget|python-requests|httpclient|scrapy|bot|spider|scan|masscan|dirbuster|nmap 1;
}

# Rate/conn limit zones for static assets
limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# --- HTTP (redirect to HTTPS) ---
server {
  listen 80;
server_name ggeecsxio.com;
  return 301 https://$host$request_uri;
  # redirect ke HTTPS
  # Restore real client IP behind Cloudflare
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2c0f:f248::/32;
  set_real_ip_from 2a06:98c0::/29;

  return 301 https://$host$request_uri;
}

# --- HTTPS (Cloudflare Full/Strict recommended) ---
server {
  listen 443 ssl http2;
  server_name ggeecsxio.com;

  if ($http_x_edge_secret != "myrandomsecret123") {
      return 403;
  }
  # Cloudflare Origin Certificate
  ssl_certificate     /etc/ssl/cloudflare/ggeecsxio.com.origin.crt;
  ssl_certificate_key /etc/ssl/cloudflare/ggeecsxio.com.origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;

  # Restore real client IP behind Cloudflare
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2c0f:f248::/32;
  set_real_ip_from 2a06:98c0::/29;

  root /var/www/frontend-spa/dist;
  index index.html;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # CSP (adjust backend domains as needed)
  add_header Content-Security-Policy "default-src 'self' data: blob:; img-src 'self' data: blob: https://ggeecsxio.com https://api.ggeeccss.xyz; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.ggeeccss.xyz; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Block common scraper UAs
  if ($bad_ua) { return 403; }

  # SPA fallback
  location / {
    # Serve SPA HTML and avoid stale cached copies;
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires -1;
  }
  # Static assets: cache + anti-scan (rate-limit & conn-limit)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf)$ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    # Relax limits to avoid throttling during initial page load
    limit_req zone=req_zone burst=100 nodelay;
    limit_conn conn_zone 30;
    limit_req_status 429;
    add_header Retry-After 5 always;
  }

  # Backend proxy (adjust host/path if different)
  proxy_redirect off;
  proxy_set_header Host api.ggeeccss.xyz;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_ssl_server_name on;

  location ^~ /api/ {
    proxy_pass https://api.ggeeccss.xyz/api/;
  }
  location ^~ /logout {
    proxy_pass https://api.ggeeccss.xyz/logout;
  }

  # Proxy gateway endpoints (auth, etc.) to backend
  location ^~ /gateway/ {
    # Mask real backend paths: /gateway/... -> /api/...
    proxy_pass https://api.ggeeccss.xyz/api/;
  }

  location ^~ /media/ {
    # Handle CORS preflight requests for media
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400;
        return 204;
    }

    # Add CORS header for actual GET requests
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;

    proxy_pass https://api.ggeeccss.xyz/media/;
}

}
